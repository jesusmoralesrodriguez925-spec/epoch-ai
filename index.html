    <script>
      // Self-healing & resilient Service Worker registration for WebAPK / Android WebView
      if (typeof window !== 'undefined' && 'serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              reg.onupdatefound = function() {
                var installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = function() {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      // New content available, activate immediately
                      installingWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  };
                }
              };
            })
            .catch(function(err) {
              console.warn('Service worker registration fallback:', err);
            });
        });
      }
    </script>

                <stop offset="30%" stop-color="#a1a1aa" />
