  <circle cx="1065" cy="270" r="40" fill="url(#cyanWide)" opacity="0.8"/>
  <text x="990" y="350" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff">App Running at Port 3000</text>
  <text x="965" y="375" font-family="sans-serif" font-size="11" fill="#10b981">✓ Connected &amp; Real-time Sync</text>
