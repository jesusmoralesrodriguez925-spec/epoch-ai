<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgWide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d14"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="cyanWide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  
  <rect width="1280" height="720" fill="url(#bgWide)"/>
  
  <!-- Left Sidebar -->
  <rect x="20" y="20" width="260" height="680" rx="16" fill="#10111a" stroke="#222436" stroke-width="1.5"/>
  <circle cx="55" cy="55" r="14" fill="url(#cyanWide)"/>
  <text x="80" y="62" font-family="sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="1">KODI AI</text>
  
  <rect x="35" y="100" width="230" height="38" rx="8" fill="#1c1e2d"/>
  <text x="50" y="124" font-family="sans-serif" font-size="13" font-weight="600" fill="#22d3ee">💬 Nuevo Chat</text>
  
  <text x="35" y="180" font-family="sans-serif" font-size="11" font-weight="700" fill="#71717a">MODELOS</text>
  <rect x="35" y="195" width="230" height="34" rx="6" fill="#151622"/>
  <text x="50" y="217" font-family="sans-serif" font-size="12" fill="#e4e4e7">⚡ Gemini 2.5 Flash</text>
  <rect x="35" y="235" width="230" height="34" rx="6" fill="#151622"/>
  <text x="50" y="257" font-family="sans-serif" font-size="12" fill="#e4e4e7">🚀 Groq Llama 3.3 70B</text>
  <rect x="35" y="275" width="230" height="34" rx="6" fill="#151622"/>
  <text x="50" y="297" font-family="sans-serif" font-size="12" fill="#e4e4e7">🧠 DeepSeek R1 Reasoning</text>
  
  <!-- Center Main Workspace -->
  <rect x="300" y="20" width="960" height="680" rx="16" fill="#12131d" stroke="#222436" stroke-width="1.5"/>
  
  <!-- Top Bar -->
  <rect x="320" y="40" width="920" height="50" rx="10" fill="#191a27" stroke="#26283d"/>
  <text x="340" y="70" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">Autonomous Full-Stack Engineering Environment</text>
  <rect x="1100" y="48" width="120" height="34" rx="8" fill="url(#cyanWide)"/>
  <text x="1125" y="70" font-family="sans-serif" font-size="12" font-weight="700" fill="#000000">Descargar APK</text>
  
  <!-- Code Area -->
  <rect x="320" y="110" width="550" height="550" rx="12" fill="#090a0f" stroke="#1f2130"/>
  <circle cx="345" cy="135" r="5" fill="#ef4444"/>
  <circle cx="362" cy="135" r="5" fill="#f59e0b"/>
  <circle cx="379" cy="135" r="5" fill="#10b981"/>
  <text x="400" y="140" font-family="monospace" font-size="12" fill="#71717a">server.ts</text>
  
  <text x="340" y="175" font-family="monospace" font-size="13" fill="#06b6d4">import</text>
  <text x="395" y="175" font-family="monospace" font-size="13" fill="#ffffff">express from 'express';</text>
  <text x="340" y="205" font-family="monospace" font-size="13" fill="#a855f7">const</text>
  <text x="385" y="205" font-family="monospace" font-size="13" fill="#ffffff">app = express();</text>
  <text x="340" y="245" font-family="monospace" font-size="13" fill="#71717a">// Gemini &amp; Groq Cloud Inference</text>
  <text x="340" y="275" font-family="monospace" font-size="13" fill="#3b82f6">app.post</text>
  <text x="410" y="275" font-family="monospace" font-size="13" fill="#ffffff">('/api/agent', async (req, res) =&gt; {</text>
  <text x="365" y="305" font-family="monospace" font-size="13" fill="#ffffff">const solution = await kodiEngine.execute(req.body);</text>
  <text x="365" y="335" font-family="monospace" font-size="13" fill="#ffffff">res.json({ success: true, solution });</text>
  <text x="340" y="365" font-family="monospace" font-size="13" fill="#ffffff">});</text>
  
  <!-- Right Panel / Live Preview -->
  <rect x="890" y="110" width="350" height="550" rx="12" fill="#161724" stroke="#222436"/>
